<?xml version="1.0" encoding="UTF-8"?>
<!--
  变体 A4：更几何（把父形里"随手画的"关系换成一组对齐）
    1. 一个半径：槽端头 r64（槽宽 128）＝ 气泡四角 r64 —— 全图只有一种圆角；
    2. 两条对齐线：槽顶 = 气泡顶（y320）、槽底 = 尾底（y704）；
    3. 尾巴没有细尖：底边留 64 宽的平口（(512,704)-(576,704)），只靠一条短斜边收上来；
    4. 所有关键边都落在 64 的整数倍上（192/320/448/832/576/640/704）——
       64 单位正好是 16px 下的 1 个设备像素 ⇒ 16px 渲染时槽 2px、缝 2px、气泡 6×5px
       全落在整像素边界上（实测 16px 本体 0 个半亮像素），只剩尾巴那条 45° 短斜边
       固定会有 1 个半亮像素。这一条是 A4 与其他三张的结构差别。
    前景包围盒 x 192–832 · y 320–704，中心 (512,512) 与画布中心重合。
  共同约定见 a1-slot-bubble-refined.svg 头部注释（1024 viewBox / #bg #fg 分层 / 66% 安全区 / 单色 #8abeb7）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="变体 A4 更几何：统一圆角、顶底对齐、无细尖的平口短尾">
  <desc>左侧全圆端头竖槽，右侧同半径圆角气泡，顶部与气泡对齐、尾部与槽底对齐，尾巴是平口。</desc>
  <rect id="bg" x="0" y="0" width="1024" height="1024" fill="#0f1013"/>
  <g id="fg" fill="#8abeb7">
    <rect x="192" y="320" width="128" height="384" rx="64"/>
    <rect x="448" y="320" width="384" height="320" rx="64"/>
    <path d="M 512 624 L 640 624 L 576 704 L 512 704 Z"/>
  </g>
</svg>
